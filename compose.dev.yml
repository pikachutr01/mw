# Yalnız GELİŞTİRME altyapısı. Uygulama host'ta çalışır (pnpm dev), burada değil.
# Üretimde bu dosya KULLANILMAZ — VPS'te native Postgres + PM2 (§4.0).
services:
  postgres:
    image: postgres:17-alpine
    container_name: mw-postgres
    environment:
      POSTGRES_USER: mobilwar
      POSTGRES_PASSWORD: mobilwar
      POSTGRES_DB: mobilwar
      # citext uzantısı migration'da açılır (accounts.email)
    ports: ['5432:5432']
    volumes: ['mw-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mobilwar -d mobilwar']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mw-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']

  mailpit:
    image: axllent/mailpit:latest
    container_name: mw-mailpit
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # web arayüzü → http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  mw-pgdata:
