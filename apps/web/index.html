  <!-- ⭐ Ana sayfa artık herkese açık (§9.3.6): arama motoru ve paylaşım önizlemesi için
       künye şart.
       ⚠️ `og:image` ve `og:url` **mutlak** olmak ZORUNDA — paylaşım önizlemesini üreten bot
       sayfayı kendi sunucusunda çözer, göreli yol onda hiçbir şeye denk gelmez. Bu yüzden
       alan adı (`mobilwar.com`) burada gömülü; localhost'ta önizleme yanlış görünür ama
       önizlemeyi zaten yalnız botlar okur. Alan adı değişirse bu iki satır da değişir. -->

  <meta property="og:site_name" content="MobilWar" />
