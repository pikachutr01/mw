<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Tema, ilk boyamadan ÖNCE uygulanmalı; yoksa gece modunda beyaz ekran çakması olur. -->
    <script>
      (function () {
        var t = localStorage.getItem('mw-theme') || 'system';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!--
      Tipografi (§13.13): Cinzel = başlıklar (Roma kitabesi karakteri, oyunun antik dili),
      Spectral = gövde (sıcak serif, uzun metinde yorucu değil), JetBrains Mono = sayılar
      (tabular rakam → kaynak ve geri sayım sütunları kaymaz).
      ⚠️ Bu fontlar token'larda TANIMLIYDI ama hiç YÜKLENMİYORDU; tarayıcı Georgia/system-ui'ye
      düşüyordu — arayüzün "sade" görünmesinin en büyük sebeplerinden biri buydu.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      PWA (kullanıcı isteği): telefona kurulabilsin, tam ekran açılsın. **Çevrimdışı desteği
      bilerek YOK** — gerekçesi `public/sw.js` başında.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      ⭐ İKON SETİ — kaynak `images/favicon.png` (1254², opak plaka).
      · `favicon.ico` eski tarayıcılar ve Windows kısayolu için (16/32/48 tek dosyada)
      · 32/16 px PNG'ler modern sekme ikonu
      · `apple-touch-icon` 180 px: iOS maske UYGULAMAZ, şeffaflık istemez → kaynağın kendisi
      · maskable sürümler manifest'te; Android kendi maskesini uygular (bkz. manifest)
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1410" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mobiwar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
