<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Tema, ilk boyamadan ÖNCE uygulanmalı; yoksa gece modunda beyaz ekran çakması olur. -->
    <script>
      (function () {
        var t = localStorage.getItem('mw-theme') || 'system';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>Mobiwar</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
