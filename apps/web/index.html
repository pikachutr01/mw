<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--
    Tema ve arka plan İLK BOYAMADAN ÖNCE: React'i beklerlerse sayfa bir kare yanlış görünür
    (gündüz temasında açılıp geceye atlamak / arka planın sonradan belirmesi).

    ⚠️ Arka plan `p.bgImage === true` ile aranıyor, yani "anahtar yoksa kapalı". Bu,
    `prefs.ts`teki `bgImage.default = false` ile AYNI cümle olmak zorunda; ikisi ayrışırsa
    ilk boyamada görsel yanıp söner. `test/prefs.test.ts` varsayılanı kilitliyor.
  -->
  <script>
    (function () {
      var t = localStorage.getItem('mw-theme') || 'system';
      if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      try {
        var p = JSON.parse(localStorage.getItem('mw-prefs') || '{}');
        if (p.bgImage === true) document.documentElement.setAttribute('data-backdrop', 'on');
      } catch (e) { /* bozuk/erişilemez depo: arka plan yok, sayfa yine açılır */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1a1410" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
