<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mobiwar">
  <!--
    Uygulama simgesi (PWA + favicon). Renkler burada SABİT: bu bir marka varlığıdır, arayüz değil —
    telefonun ana ekranında tema token'ları yoktur. Tonlar design-tokens'taki obsidyen/bronz
    paletiyle aynı ailedendir ki yüklü uygulama oyunla aynı görünsün.
  -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c274" />
      <stop offset="0.55" stop-color="#c8973f" />
      <stop offset="1" stop-color="#8a6224" />
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2119" />
      <stop offset="1" stop-color="#12100c" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#stone)" />
  <rect x="14" y="14" width="484" height="484" rx="84" fill="none" stroke="#c8973f" stroke-opacity="0.55" stroke-width="10" />

  <g fill="url(#bronze)">
    <!-- Yan kuleler (mazgallı) -->
    <path d="M96 200h24v-26h26v26h24v-26h26v26h24v212H96z" />
    <path d="M292 200h24v-26h26v26h24v-26h26v26h24v212H292z" />
    <!-- Orta gövde -->
    <path d="M164 262h22v-24h26v24h24v-24h26v24h24v-24h26v24h22v150H164z" />
  </g>

  <!-- Kapı: gövdeyi delen koyu kemer, simge küçüldüğünde silueti tanınır kılar -->
  <path d="M224 412V352a32 32 0 0 1 64 0v60z" fill="#12100c" />
  <!-- Mazgal delikleri -->
  <g fill="#12100c">
    <rect x="132" y="250" width="18" height="30" rx="6" />
    <rect x="362" y="250" width="18" height="30" rx="6" />
    <rect x="200" y="306" width="18" height="26" rx="6" />
    <rect x="294" y="306" width="18" height="26" rx="6" />
  </g>
</svg>
