# ── Cloudflare arkasında GERÇEK istemci IP'si ────────────────────────────────
# Sunucuda: /etc/nginx/conf.d/cloudflare-realip.conf   (kaynak: mw/ops/nginx/)
#
# ⭐ NEDEN ZORUNLU — bu dosya olmadan sessizce bozulan üç şey:
#   1. `MAIL_DAILY_PER_IP` (30): tüm oyuncular tek Cloudflare IP'sinden görünür → 30. mailden
#      sonra HERKESİN doğrulama ve şifre sıfırlama maili kesilir.
#   2. Giriş rate-limit'i (`auth/rate-limit.ts`): bir oyuncunun hatalı denemeleri diğer
#      herkesi bloklar.
#   3. `player_ips` çoklu-hesap tespiti: her oyuncu aynı IP'de görünür → moderasyon ekranı
#      "bu hesaplar aynı IP'den" derken hiçbir şey söylemez.
#
# Kod tarafı DOĞRU: `abuse/device-context.ts` IP'yi `X-Forwarded-For`un ilk öğesinden okuyor.
# Sorun nginx'in oraya ne yazdığında: `$remote_addr` varsayılan olarak **Cloudflare edge**
# IP'sidir. `real_ip_header CF-Connecting-IP` ile `$remote_addr`ın kendisi gerçek istemciye
# çevrilir; site bloklarındaki `proxy_set_header X-Forwarded-For $remote_addr` ondan sonra
# doğru değeri taşır.
#
# ⚠️ `set_real_ip_from` listesi **yalnız Cloudflare aralıklarını** içermeli. Buraya rastgele
# bir IP eklemek, o IP'nin CF-Connecting-IP başlığını uydurup kendini başka biri gibi
# göstermesine izin verir (IP kılığına girme).
#
# 🔄 GÜNCELLEME: Cloudflare aralıkları nadiren değişir. `ops/cloudflare-ip-guncelle.sh`
# betiği listeyi https://www.cloudflare.com/ips-v4 ve ips-v6'dan çekip bu dosyayı yeniden
# üretir; kurulumda aylık cron'a bağlanır.

# --- IPv4 (https://www.cloudflare.com/ips-v4) ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- IPv6 (https://www.cloudflare.com/ips-v6) ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ⚠️ Bu dosya http bağlamında (conf.d) yüklenir, yani SUNUCUDAKİ TÜM SİTELERİ etkiler.
# Diğer siteler (scrabblecozucu.com, klavyetest.xyz) Cloudflare'de DEĞİL: onlara doğrudan
# gelen isteklerde `CF-Connecting-IP` başlığı yoktur ve `set_real_ip_from` eşleşmez, bu
# yüzden `$remote_addr` onlarda değişmeden kalır. Yani bu dosya onlar için etkisizdir.

# ── «Bu istek gerçekten Cloudflare'den mi geldi?» ────────────────────────────
# ⭐ Yönetim paneli için KRİTİK. Cloudflare Access, panele giden trafiği Cloudflare'in
# KENDİ kenarında durdurur — ama origin'e DOĞRUDAN gelen isteği göremez bile. Bu sunucunun
# IP'si zaten herkese açık (`scrabblecozucu.com` aynı kutuda ve Cloudflare'de değil), yani
# `https://<ip>` + `Host: admin.mobilwar.com` ile Access **atlanabilirdi**. Aşağıdaki bayrak
# tam olarak bunu kapatıyor: panel bloğu, Cloudflare'den gelmeyen her isteği düşürüyor.
#
# ⚠️ `$realip_remote_addr` = real_ip modülü DEĞİŞTİRMEDEN ÖNCEKİ gerçek TCP karşı tarafı.
# Burada `$remote_addr` kullanmak bu korumayı işe yaramaz hâle getirirdi: o değişken
# CF-Connecting-IP ile ezilmiş, yani saldırganın kendi yazdığı değerdir.
geo $realip_remote_addr $mw_cloudflare {
    default 0;

    173.245.48.0/20   1;
    103.21.244.0/22   1;
    103.22.200.0/22   1;
    103.31.4.0/22     1;
    141.101.64.0/18   1;
    108.162.192.0/18  1;
    190.93.240.0/20   1;
    188.114.96.0/20   1;
    197.234.240.0/22  1;
    198.41.128.0/17   1;
    162.158.0.0/15    1;
    104.16.0.0/13     1;
    104.24.0.0/14     1;
    172.64.0.0/13     1;
    131.0.72.0/22     1;

    2400:cb00::/32    1;
    2606:4700::/32    1;
    2803:f800::/32    1;
    2405:b500::/32    1;
    2405:8100::/32    1;
    2a06:98c0::/29    1;
    2c0f:f248::/32    1;
}
