# ── MobilWar — oyun (mobilwar.com) ───────────────────────────────────────────
# Sunucuda: /etc/nginx/sites-available/mobilwar.com  (kaynak: mw/ops/nginx/)
#
# Statik dosyalar `current` symlink'i üzerinden okunur: sürüm değişimi tek `ln -sfn` ile
# ANLIK olur, nginx yeniden başlatmaya gerek kalmaz (§ops/surum-yayinla.sh).

# --- 80: yalnız ACME + HTTPS'e yönlendirme -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mobilwar.com www.mobilwar.com;

    # ⚠️ Bu blok certbot yenilemesi için ŞART. `certonly --webroot` kullanıyoruz;
    # certbot nginx yapılandırmasına HİÇ dokunmuyor (dosya depoda versiyonlu kalsın diye).
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://mobilwar.com$request_uri; }
}

# --- www → apex --------------------------------------------------------------
# Tek kanonik köken şart: `APP_ORIGIN` tek bir adres (mail bağlantıları ondan üretiliyor)
# ve service worker kapsamı da kökene bağlı.
server {
    # ⚠️ `http2 on;` DEĞİL: o söz dizimi nginx 1.25+ ile geldi, sunucuda 1.24 var ve
    # yapılandırma «unknown directive» ile reddedilir (nginx -t bunu yakaladı).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mobilwar.com;

    ssl_certificate     /etc/letsencrypt/live/mobilwar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilwar.com/privkey.pem;

    return 301 https://mobilwar.com$request_uri;
}

# --- Oyun --------------------------------------------------------------------
server {
    # ⚠️ `http2 on;` DEĞİL: o söz dizimi nginx 1.25+ ile geldi, sunucuda 1.24 var ve
    # yapılandırma «unknown directive» ile reddedilir (nginx -t bunu yakaladı).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mobilwar.com;

    ssl_certificate     /etc/letsencrypt/live/mobilwar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilwar.com/privkey.pem;

    root /var/www/mobilwar/current/web;
    index index.html;

    # Oyun ekranlarında 42 birim/yapı ikonu birden yükleniyor; sıkıştırma kazancı büyük.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Savaş raporu ve toplu görev yükleri birkaç yüz KB olabiliyor.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API + WebSocket → tek Node süreci (:3002) ────────────────────────────
    # ⭐ Oyun ve API AYNI kökenden konuşuyor; bu yüzden `apps/api` tarafında CORS açmaya
    # gerek yok ve WS ağ geçidi bilerek `cors:{origin:false}` kalıyor.
    location ~ ^/(api|healthz|ws) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # ⚠️ `$remote_addr` burada GERÇEK istemcidir — ama yalnız conf.d/cloudflare-realip.conf
        # yüklüyse. O dosya olmadan Cloudflare edge IP'si yazılır ve IP başına tüm limitler
        # tek kovaya düşer (ayrıntı o dosyanın başında).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;

        # socket.io yükseltmesi: bu iki başlık olmadan WS kurulmaz, istemci sessizce
        # polling'e düşer ve "bağlantı koptu" göstermeye başlar.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WS bağlantısı uzun yaşar; varsayılan 60 sn okuma zaman aşımı onu koparırdı.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Destek eki YÜKLEME: yalnız bu yolda büyük gövde ──────────────────────
    # ⚠️⚠️ TAM EŞLEŞME (`=`) ŞART. Yukarıdaki `location ~ ^/(api|healthz|ws)` bir REGEX ve
    #    nginx'te regex konumları prefix konumlarını YENER; `= /tam/yol` ise hepsinden önce
    #    gelir. Prefix yazsaydık bu blok hiç seçilmez, yükleme sessizce genel 2 MB sınırına
    #    düşer ve kullanıcı sebepsiz bir 413 görürdü.
    # ⚠️ Sınır `support.maxAttachmentBytes` (panel, varsayılan 5 MB) ile UYUMLU olmalı ve
    #    ondan büyük durmalı — multipart zarfı birkaç yüz bayt yer kaplıyor.
    location = /api/v1/support/uploads {
        client_max_body_size 6m;
        proxy_request_buffering on;   # yavaş yüklemeyi Node değil nginx tutsun
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }
    location = /api/v1/support/public/uploads {
        client_max_body_size 6m;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }
    # ⚠️ Yöneticinin yükleme ucu BURADA DEĞİL: panel ayrı alt alanda ve `/api/` isteklerini
    #    kendi bloğundan proxy'liyor → `ops/nginx/admin.mobilwar.com.conf`.

    # ── Destek eki İNDİRME: dosyayı nginx servis eder, yetkiyi API verir ─────
    # ⚠️⚠️ `internal;` ŞART. Olmadan `/_uploads/...` doğrudan istenebilir ve URL'yi bilen
    #    herkes eki indirir — oysa ek ÖZEL bir yazışmanın parçası. Akış şöyle: istemci
    #    `/api/v1/support/attachments/:id` ister → API sahipliği doğrular → yanıtta
    #    `X-Accel-Redirect: /_uploads/support/...` döner (gövdesiz) → baytları nginx taşır.
    #    Node dosya okumaz, yetki nginx'e emanet edilmez.
    # ⚠️ `Content-Type` API'nin SNIFF ettiği türden geliyor; nginx'in uzantı tahmini
    #    kullanılmamalı (yüklenen bir dosyanın HTML olarak yorumlanma ihtimali kapanır).
    location /_uploads/ {
        internal;
        alias /var/lib/mobilwar/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type application/octet-stream;
    }

    # ── Service worker + manifest: ASLA önbelleğe alınmaz ────────────────────
    # ⚠️ PWA'nın en klasik tuzağı: `sw.js` bir kez önbelleğe girerse tarayıcı eski service
    # worker'ı çalıştırmaya devam eder ve oyuncu YENİ SÜRÜMÜ HİÇ GÖRMEZ — üstelik dağıtım
    # başarılı görünür. Cloudflare de aynı sebeple atlanıyor (`no-store`).
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # ── Hash'li varlıklar: sonsuza kadar önbellek ────────────────────────────
    # Vite dosya adına içerik hash'i koyuyor; içerik değişince ad da değişir, bu yüzden
    # eski sürümü servis etme riski YOK.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # `index.html` önbelleğe girmemeli: girerse yeni dağıtımdan sonra tarayıcı ESKİ
    # index'i açar, o da artık var olmayan hash'li paketleri ister → boş ekran.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
