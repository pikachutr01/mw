# ── MobilWar — yönetim paneli (admin.mobilwar.com) ───────────────────────────
# Sunucuda: /etc/nginx/sites-available/admin.mobilwar.com  (kaynak: mw/ops/nginx/)
#
# ⭐ Panel neden AYRI alt alan: `apps/admin` ayrı bir derleme hedefi — oyuncunun indirdiği
# pakete admin kodundan tek bayt girmiyor (docs/ADMIN_PANELI.md). Ayrı köken olduğu için
# `/api/` isteklerini de KENDİ bloğundan proxy'lemek zorunda; API'de CORS açmak çözüm değil
# (WS ağ geçidi bilerek `cors:{origin:false}`).
#
# ⭐ ÜÇ KATMANLI koruma — üçü de ayrı bir şeyi kesiyor:
#   1. Bu blok: Cloudflare'den gelmeyen istek → 444 (Access'i origin üzerinden atlamayı kapatır)
#   2. Cloudflare Access: e-posta doğrulamalı kapı (bot taraması giriş ekranını hiç görmez)
#   3. Panelin kendi `AdminGuard`'ı + adım yükseltmesi (asıl yetki sınırı — hep buradadır)

server {
    listen 80;
    listen [::]:80;
    server_name admin.mobilwar.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://admin.mobilwar.com$request_uri; }
}

server {
    # ⚠️ `http2 on;` DEĞİL: o söz dizimi nginx 1.25+ ile geldi, sunucuda 1.24 var ve
    # yapılandırma «unknown directive» ile reddedilir (nginx -t bunu yakaladı).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mobilwar.com;

    ssl_certificate     /etc/letsencrypt/live/mobilwar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilwar.com/privkey.pem;

    # ⛔ Cloudflare dışından gelen her istek sessizce düşer (bkz. conf.d/cloudflare-realip.conf).
    # Bunu kaldırmak, paneli origin IP'si üzerinden Access'siz erişilebilir yapar.
    if ($mw_cloudflare = 0) { return 444; }

    root /var/www/mobilwar/current/admin;
    index index.html;

    # Panel arama motorlarına ve çerçeveye kapalı.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Destek eki yükleme: yalnız bu yolda büyük gövde (2026-08-14) ─────────
    # ⚠️⚠️ TAM EŞLEŞME (`=`) ŞART: aşağıdaki `location ~ ^/(api|healthz)` bir REGEX ve nginx'te
    #    regex konumları prefix konumlarını yener; `= /tam/yol` ise hepsinden önce gelir.
    #    Prefix yazsaydık bu blok hiç seçilmez, yükleme varsayılan 1 MB gövde sınırına düşer
    #    ve yönetici sebepsiz bir 413 görürdü.
    location = /api/v1/admin/support/uploads {
        client_max_body_size 6m;
        proxy_request_buffering on;   # yavaş yüklemeyi Node değil nginx tutsun
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }

    location ~ ^/(api|healthz) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }

    # ── Destek eki indirme (yönetici) — oyun bloğundakiyle AYNI desen ─────────
    # ⚠️ `internal;` olmadan URL'yi bilen herkes eki indirir. Yetkiyi API veriyor,
    #    baytları nginx taşıyor (`X-Accel-Redirect`).
    location /_uploads/ {
        internal;
        alias /var/lib/mobilwar/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type application/octet-stream;
    }

    # ⚠️ Panelin WS istemcisi YOK (`apps/admin` socket.io'ya bağımlı değil) — bu yüzden
    # burada `/ws` proxy'si bilerek yok. Eklemek gerekirse önce o kararın hâlâ geçerli
    # olduğuna bak, yoksa gereksiz bir yüzey açmış olursun.

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
