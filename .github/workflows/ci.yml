name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Faz 1 testleri GERÇEK Postgres istiyor: SKIP LOCKED, advisory lock ve transaction
    # geri alma taklit edilemez — omurganın tüm garantileri tam olarak bunlara dayanıyor.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mobilwar
          POSTGRES_PASSWORD: mobilwar
          POSTGRES_DB: mobilwar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mobilwar -d mobilwar"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://mobilwar:mobilwar@localhost:5432/mobilwar

    steps:
      - uses: actions/checkout@v5

      # pnpm sürümü BURADA belirtilmez — package.json'daki "packageManager" alanı tek kaynaktır.
      # İkisini birden vermek ERR_PNPM_BAD_PM_VERSION riskine karşı hata verir.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Migration'lar depoda; sunucuda ASLA `push` yapılmaz (§4.0). CI de aynı yolu kullanır.
      - name: Migration'ları uygula
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      # Üretilen tasarım token'ları kaynakla senkron mu? (§13.13.1 — sürüklenme yasak)
      - name: Tasarım token'ları senkron mu
        run: pnpm tokens:check

      # Üretilen Dart sözleşmeleri zod kaynağıyla senkron mu? (MOBIL_MIMARI.md §4.1 · kapı 1)
      # ⭐ Bu adım Flutter SDK'sı İSTEMEZ — üreteç Node tarafında koşuyor ve karşılaştırma düz
      # metin. Mobilin sürüklenme kapısı bu yüzden ana CI'da durabiliyor.
      - name: Dart sözleşmeleri senkron mu
        run: pnpm contracts:check
