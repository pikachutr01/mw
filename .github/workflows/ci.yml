name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm sürümü BURADA belirtilmez — package.json'daki "packageManager" alanı tek kaynaktır.
      # İkisini birden vermek ERR_PNPM_BAD_PM_VERSION riskine karşı hata verir.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Üretilen tasarım token'ları kaynakla senkron mu? (§13.13.1 — sürüklenme yasak)
      - name: Tasarım token'ları senkron mu
        run: pnpm tokens:check
